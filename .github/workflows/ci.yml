name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number"
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install packages
        shell: bash
        run: |
          set -e
          apt update && apt install -y git python3
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install and compile
        shell: bash
        run: npm ci && npm run dts && npm run compile

      - name: version tag check
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: python3 .github/build.py version-check --tag "$REF_NAME"

      - name: Audit dependencies
        shell: bash
        run: npm audit --audit-level=moderate

      - name: "Build and format"
        run: |
          set -e
          # npm run format
          npx eslint --fix "src/**/*.ts"
          git diff --exit-code

  tests:
    name: Tests
    needs: build
    uses: ./.github/workflows/test.yml

  build-package:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    container:
      image: node:22.22.3-bookworm-slim

    defaults:
      run:
        shell: bash

    outputs:
      version:     ${{ steps.build.outputs.version }}
      vsix_file:   ${{ steps.build.outputs.vsix_file }}
      vsix_sha256: ${{ steps.build.outputs.vsix_sha256 }}
      pre_release: ${{ steps.build.outputs.pre_release }}

    steps:
      - name: Install packages
        shell: bash
        run: |
          set -e
          apt update && apt install -y git python3
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install and compile
        shell: bash
        run: npm ci && npm run dts

      - name: Build
        id: build
        env:
          IS_TAG: ${{ github.ref_type == 'tag' }}
          PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.pr }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e
          if [ -n "$PR_NUMBER" ]; then
            git fetch origin "pull/$PR_NUMBER/head"
            if [ -z "$PR_HEAD_SHA" ]; then
              PR_HEAD_SHA=$(git rev-parse FETCH_HEAD)
            fi
          fi
          if [ "$IS_TAG" = "true" ]; then
            python3 .github/build.py release --tag "$REF_NAME"
          elif [ -n "$PR_NUMBER" ]; then
            python3 .github/build.py ci --pr "$PR_NUMBER" --sha "$PR_HEAD_SHA" --run "$RUN_NUMBER"
          else
            python3 .github/build.py ci --branch "$REF_NAME" --run "$RUN_NUMBER"
          fi

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: open-remote-devcontainer@v${{ steps.build.outputs.version }}
          path: |
            *.vsix
            *.vsix.sha256

  publish:
    needs: build-package
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.build-package.outputs.version) }}
      pre_release: ${{ needs.build-package.outputs.pre_release == 'true' }}
      artifact_name: open-remote-devcontainer@v${{ needs.build-package.outputs.version }}
      vsix_file: ${{ needs.build-package.outputs.vsix_file }}
      vsix_sha256: ${{ needs.build-package.outputs.vsix_sha256 }}
      publish_ovsx: true
    secrets: inherit
