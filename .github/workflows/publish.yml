name: Publish

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      pre_release:
        type: boolean
        default: true
        required: true
      vsix_file:
        type: string
        required: true
      vsix_sha256:
        type: string
        required: true
      artifact_name:
        type: string
        required: true

jobs:
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ inputs.artifact_name }}

      - name: Extract changelog
        id: changelog
        env:
          GH_TAG: ${{ inputs.tag }}
        run: |
          set -e
          NOTES=$(python3 .github/build.py changelog --tag "$GH_TAG")
          {
            echo "body<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TAG: ${{ inputs.tag }}
          GH_SHA: ${{ github.sha }}
          PRE_RELEASE: ${{ inputs.pre_release }}
          VSIX_FILE: ${{ inputs.vsix_file }}
          VSIX_SHA256: ${{ inputs.vsix_sha256 }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.body }}
        run: |
          set -e
          FLAGS=""
          if [ "$PRE_RELEASE" = "true" ]; then FLAGS="--prerelease"; fi
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          gh release create "$GH_TAG" $FLAGS --target "$GH_SHA" --notes-file release-notes.md "$VSIX_FILE" "$VSIX_SHA256"

  inspect:
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    outputs:
      sha256: ${{ steps.vsix.outputs.sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inspect release vsix
        id: vsix
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: python3 .github/ovsx.py inspect --tag "$TAG"

  # Uses open-vsx trusted publish without OVSX_PAT
  # workflow call = open-vsx sees ci.yml as the script
  # Approve after checking the sha matches a local isolated build
  # Needs both required review + versioned tags for this step
  ovsx-publish:
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ovsx-publish

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release vsix and publish to Open VSX
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ needs.inspect.outputs.sha256 }}
          TAG: ${{ inputs.tag }}
        run: python3 .github/ovsx.py publish --tag "$TAG" --sha256 "$SHA256"
